name: advanced_doctor_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  #State Management
  flutter_bloc: ^9.1.1
  #Code Generator (mainly used with cubit & retrofit)
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  #Dependency Injection
  get_it: ^9.2.1
  #Code Generator for converting to and from JSON
  json_serializable: ^6.14.0
  json_annotation: ^4.12.0
  build_runner: ^2.15.1
  #Networking
  dio: ^5.10.0
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.7
  pretty_dio_logger: ^1.4.0
  #localization
  intl: ^0.20.2
  easy_localization: ^3.0.8
  #for splash screen
  flutter_native_splash: ^2.4.8
  #svg
  flutter_svg: ^2.3.0
  #for responsive UI
  flutter_screenutil: ^5.9.3
  #Replased SizedBox
  flutter_gap: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
   - assets/images/
   - assets/svgs/

